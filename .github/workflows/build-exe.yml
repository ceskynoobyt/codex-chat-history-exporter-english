name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Chat-Exporter-Desktop-english
          path: release/*.exe